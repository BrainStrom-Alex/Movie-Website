{% extends 'base.html' %}

{% block title %}Select Movie{% endblock %}

{% block content %}
<div class="container">
    <h1 class="heading">Select Movie</h1>
        {% for result in response: %}
          <p>
            <a href="{{ url_for('added', title=result['original_title'], img_url=result['poster_path'],
             overview=result['overview'], year=result['release_date'].split('-')[0], rating=result['vote_average']) }}">
                {{ result["original_title"] }} - {{ result["release_date"].split("-")[0] }}</a>
          </p>
        {% endfor %}
</div>
{% endblock %}
